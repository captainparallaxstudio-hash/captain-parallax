name: Render Captain Parallax Video

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Render Remotion Video
        run: npx remotion render src/index.ts MainComp out/video.mp4

      - name: Upload MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4  
